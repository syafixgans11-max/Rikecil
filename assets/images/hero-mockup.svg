      <rect x="8" y="8" width="82" height="56" rx="4" fill="#1E293B"/>
      <circle cx="49" cy="36" r="18" fill="#DC2626"/>
      <text x="49" y="40" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">FF</text>
      <text x="49" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Free Fire MAX</text>
      <text x="49" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Mulai Rp 1.000</text>

      <rect x="0" y="0" width="98" height="118" rx="6" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <rect x="8" y="8" width="82" height="56" rx="4" fill="#1E293B"/>
      <circle cx="49" cy="36" r="18" fill="#D97706"/>
      <text x="49" y="40" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">PUBG</text>
      <text x="49" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">PUBG Mobile</text>
      <text x="49" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Mulai Rp 5.000</text>
    </g>

    <!-- Game Card 4 (Valorant) -->
    <g transform="translate(410, 260)">
      <rect x="0" y="0" width="98" height="118" rx="6" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <rect x="8" y="8" width="82" height="56" rx="4" fill="#1E293B"/>
      <circle cx="49" cy="36" r="18" fill="#E11D48"/>
      <text x="49" y="40" font-family="sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">VALO</text>
      <text x="49" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Valorant Riot</text>
      <text x="49" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Mulai Rp 14.000</text>
    </g>

    <!-- Game Card 5 (Genshin) -->
    <g transform="translate(524, 260)">
      <rect x="0" y="0" width="98" height="118" rx="6" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <rect x="8" y="8" width="82" height="56" rx="4" fill="#1E293B"/>
      <circle cx="49" cy="36" r="18" fill="#0284C7"/>
      <text x="49" y="40" font-family="sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">GENSHIN</text>
      <text x="49" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Genshin Impact</text>
      <text x="49" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Mulai Rp 16.000</text>
    </g>

    <!-- Laptop Base / Keyboard Deck -->
    <path d="M0,410 L700,410 L650,432 L50,432 Z" fill="#1A202E" stroke="#2B354A" stroke-width="1.5"/>
    <rect x="300" y="412" width="100" height="4" rx="2" fill="#10141E"/>
  </g>

  <!-- ==================== MOBILE PHONE MOCKUP ==================== -->
  <g transform="translate(680, 120)" filter="url(#cleanShadow)">
    <rect x="0" y="0" width="186" height="380" rx="24" fill="#151A27" stroke="#2B354A" stroke-width="2"/>
    <rect x="7" y="7" width="172" height="366" rx="20" fill="url(#screenGrad)"/>
    
    <!-- Notch -->

    <g transform="translate(14, 58)">
      <rect x="0" y="0" width="144" height="68" rx="6" fill="url(#bannerGrad)"/>
      <text x="10" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF">TOP UP INSTAN</text>
      <text x="10" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" fill="#CBD5E1">Proses otomatis 24 jam</text>

      <text x="40" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#1E3A8A" text-anchor="middle">ORDER</text>
    </g>

    <!-- Mobile 2x2 Grid -->
    <g transform="translate(14, 136)">
      <rect x="0" y="0" width="68" height="74" rx="4" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <circle cx="34" cy="24" r="14" fill="#2563EB"/>
      <text x="34" y="28" font-family="sans-serif" font-size="7.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">MLBB</text>
      <text x="34" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">MLBB</text>
      <text x="34" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#38BDF8" text-anchor="middle">Rp 1.500</text>

      <rect x="76" y="0" width="68" height="74" rx="4" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <circle cx="110" cy="24" r="14" fill="#DC2626"/>
      <text x="110" y="28" font-family="sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">FF</text>
      <text x="110" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Free Fire</text>
      <text x="110" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#38BDF8" text-anchor="middle">Rp 1.000</text>
    </g>

    <g transform="translate(14, 218)">
      <rect x="0" y="0" width="68" height="74" rx="4" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <circle cx="34" cy="24" r="14" fill="#D97706"/>
      <text x="34" y="28" font-family="sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">PUBG</text>
      <text x="34" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">PUBG</text>
      <text x="34" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#38BDF8" text-anchor="middle">Rp 5.000</text>

      <rect x="76" y="0" width="68" height="74" rx="4" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <circle cx="110" cy="24" r="14" fill="#E11D48"/>
      <text x="110" y="28" font-family="sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">VALO</text>
      <text x="110" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">Valorant</text>
      <text x="110" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" fill="#38BDF8" text-anchor="middle">Rp 14.000</text>
    </g>

    <!-- Bottom Nav -->
    <rect x="7" y="332" width="172" height="40" rx="14" fill="#0E131E"/>
    <circle cx="45" cy="352" r="8" fill="#2563EB"/>
    <circle cx="93" cy="352" r="6" fill="#222B3D"/>
    <circle cx="141" cy="352" r="6" fill="#222B3D"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#121724"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="cleanShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ==================== LAPTOP MOCKUP ==================== -->
  <g transform="translate(60, 30)" filter="url(#cleanShadow)">
    <!-- Laptop Lid Body -->
    <rect x="40" y="20" width="620" height="390" rx="12" fill="#151A27" stroke="#2B354A" stroke-width="2"/>
    <circle cx="350" cy="32" r="3" fill="#374151"/>
    
    <!-- Laptop Screen Bezel -->
    <rect x="52" y="44" width="596" height="352" rx="4" fill="url(#screenGrad)"/>

    <!-- Screen Content: Store Header -->
    <rect x="52" y="44" width="596" height="40" fill="#0D121E"/>
    <line x1="52" y1="84" x2="648" y2="84" stroke="#1E2638" stroke-width="1"/>
    
    <!-- Header Logo & Nav -->
    <rect x="68" y="55" width="18" height="18" rx="4" fill="#2563EB"/>
    <text x="94" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">RYUZEN <tspan fill="#38BDF8">STORE</tspan></text>
    <text x="230" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Katalog Game</text>
    <text x="310" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Voucher &amp; PPOB</text>
    <text x="400" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Lacak Transaksi</text>
    
    <!-- Member / Sign in button -->
    <rect x="550" y="53" width="84" height="22" rx="4" fill="#2563EB"/>
    <text x="592" y="67" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Masuk / Daftar</text>

    <!-- Banner -->
    <g transform="translate(68, 96)">
      <rect x="0" y="0" width="564" height="130" rx="8" fill="url(#bannerGrad)" stroke="#2B3A67" stroke-width="1"/>
      <text x="24" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF">PROMO TOP UP GAME &amp; VOUCHER</text>
      <text x="24" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#CBD5E1">Sistem Otomatis 24 Jam Nonstop dengan Verifikasi QRIS Instan</text>
      <rect x="24" y="84" width="124" height="28" rx="4" fill="#FFFFFF"/>
      <text x="86" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#1E3A8A" text-anchor="middle">BELI SEKARANG</text>
    </g>

    <!-- Popular Game Cards Grid -->
    <text x="68" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">GAME TERPOPULER HARI INI</text>
    
    <!-- Game Card 1 (MLBB) -->
    <g transform="translate(68, 260)">
      <rect x="0" y="0" width="98" height="118" rx="6" fill="#131826" stroke="#222B3D" stroke-width="1"/>
      <rect x="8" y="8" width="82" height="56" rx="4" fill="#1E293B"/>
      <circle cx="49" cy="36" r="18" fill="#2563EB"/>
      <text x="49" y="40" font-family="sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle">MLBB</text>
      <text x="49" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile Legends</text>
      <text x="49" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#38BDF8" text-anchor="middle">Mulai Rp 1.500</text>
